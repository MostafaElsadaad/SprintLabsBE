openapi: 3.0.3
info:
  title: SprintLabs Owner Community Profile API
  version: 1.0.0
paths:
  /api/v1/Communities/{communityId}:
    get:
      summary: Get a community profile
      description: Returns basic community details when the authenticated user has an Active membership.
      security:
        - bearerAuth: []
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Community profile returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityProfileBaseResponse"
        "400":
          description: Invalid community identifier.
        "401":
          description: Missing or invalid authentication token.
        "403":
          description: User is suspended or lacks Active membership.
        "404":
          description: Authenticated user or accessible community was not found.
    patch:
      summary: Update a community profile
      description: Updates name and slug when the authenticated user has an Active Owner membership.
      security:
        - bearerAuth: []
      parameters:
        - name: communityId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunityProfileRequest"
      responses:
        "200":
          description: Community profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityProfileBaseResponse"
        "400":
          description: Invalid input or duplicate slug.
        "401":
          description: Missing or invalid authentication token.
        "403":
          description: User is suspended or lacks an Active Owner membership.
        "404":
          description: Authenticated user or accessible community was not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UpdateCommunityProfileRequest:
      type: object
      required:
        - name
        - slug
      properties:
        name:
          type: string
          maxLength: 200
          example: Updated School Name
        slug:
          type: string
          maxLength: 120
          example: updated-school-slug
    CommunityProfileResponse:
      type: object
      required:
        - id
        - name
        - slug
        - status
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - Active
            - Suspended
    CommunityProfileBaseResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/CommunityProfileResponse"
        message:
          type: string
          example: Success
        statusCode:
          type: integer
          example: 200
        errorCode:
          type: integer
          example: 1
